<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ScoobyUI Companion • Partner Screen</title>
  <meta name="theme-color" content="#89B4FA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #11111B;
      --card-bg: #181825;
      --border-color: #313244;
      --text-color: #CDD6F4;
      --text-dim: #A6ADC8;
      --accent: #89B4FA;
      --accent-hover: #B4BEFE;
      --highlight-bg: #F9E2AF;
      --highlight-text: #11111B;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Top Partner Status Bar */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(24, 24, 37, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-tag {
      font-size: 0.7rem;
      background: #313244;
      color: var(--text-dim);
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
    }

    #status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #313244;
      color: var(--text-dim);
      transition: all 0.3s;
    }

    #status-pill.connected {
      background: rgba(166, 227, 161, 0.15);
      color: #A6E3A1;
      border: 1px solid rgba(166, 227, 161, 0.3);
    }

    #status-pill.waiting {
      background: rgba(249, 226, 175, 0.15);
      color: #F9E2AF;
      border: 1px solid rgba(249, 226, 175, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Main Message Display Surface */
    #viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      overflow-y: auto;
    }

    #message-container {
      width: 100%;
      max-width: 840px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px 28px;
      min-height: 200px;
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.35;
    }

    .empty-state {
      color: var(--text-dim);
      font-style: italic;
      font-size: 1.35rem;
      opacity: 0.65;
      font-weight: 500;
    }

    .msg-text {
      font-size: clamp(2rem, 6.5vw, 3.8rem);
      font-weight: 800;
      color: #FFFFFF;
      word-break: break-word;
    }

    .word {
      display: inline-block;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      border-radius: 8px;
      padding: 0 3px;
      margin: 1px 0;
    }

    .word.highlight {
      background: var(--highlight-bg);
      color: var(--highlight-text);
      box-shadow: 0 2px 8px rgba(249, 226, 175, 0.3);
      transform: scale(1.04);
    }

    /* Bottom Action Controls */
    #bottom-panel {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 12px 18px 24px;
      gap: 12px;
      z-index: 10;
    }

    /* Speak Button */
    #btn-speak {
      background: var(--accent);
      color: #11111B;
      border: none;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 14px 20px;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      min-height: 52px;
      box-shadow: 0 4px 14px rgba(137, 180, 250, 0.35);
    }

    #btn-speak:active {
      transform: scale(0.98);
      background: var(--accent-hover);
    }

    #btn-speak.speaking {
      background: #A6E3A1;
      color: #11111B;
      box-shadow: 0 4px 14px rgba(166, 227, 161, 0.35);
    }

    /* Reactions Bar */
    #reactions-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .reaction-btn {
      flex: 1;
      background: #252538;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 14px;
      font-size: 1.7rem;
      min-height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .reaction-btn:active {
      transform: scale(0.88);
      background: #313244;
    }

    .reaction-btn.text-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent);
      flex: 1.3;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="top-bar">
    <div class="brand-title">
      <span id="companion-app-name">💬 AlphaAAC</span>
      <span class="brand-tag">Companion</span>
    </div>
    <div id="status-pill" class="waiting">
      <span class="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </header>

  <!-- Message Viewport -->
  <main id="viewport">
    <div id="message-container">
      <span class="empty-state">Waiting for typing...</span>
    </div>
  </main>

  <!-- Bottom Panel -->
  <footer id="bottom-panel">
    <button id="btn-speak" onclick="speakCurrentText()">
      <span id="speak-icon">🔊</span>
      <span id="speak-label">Speak Display</span>
    </button>
    <div id="reactions-bar">
      <button class="reaction-btn" onclick="sendReaction('👍')" title="Thumbs Up" aria-label="Thumbs Up">👍</button>
      <button class="reaction-btn" onclick="sendReaction('⏳')" title="Wait a moment" aria-label="Wait a moment">⏳</button>
      <button class="reaction-btn" onclick="sendReaction('🛑')" title="Stop" aria-label="Stop">🛑</button>
      <button class="reaction-btn" onclick="sendReaction('❤️')" title="Love" aria-label="Love">❤️</button>
      <button class="reaction-btn text-label" onclick="sendReaction('Got it!')" title="Got it!" aria-label="Got it!">Got it!</button>
    </div>
  </footer>

  <script>
    const msgContainer = document.getElementById('message-container');
    const statusPill   = document.getElementById('status-pill');
    const statusText   = document.getElementById('status-text');
    const speakBtn     = document.getElementById('btn-speak');
    const speakLabel   = document.getElementById('speak-label');
    const speakIcon    = document.getElementById('speak-icon');
    
    let ws          = null;
    let currentText = '';
    let retryTimer  = null;

    // Word rendering for TTS sync
    function renderWords(text) {
      if (!text || !text.trim()) {
        msgContainer.innerHTML = '<span class="empty-state">Waiting for typing...</span>';
        return;
      }
      const tokens  = text.split(/(\s+)/);
      let html    = '<div class="msg-text">';
      let charPos = 0;
      tokens.forEach(tok => {
        if (/^\s+$/.test(tok)) {
          html += tok;
        } else {
          html += `<span class="word" data-start="${charPos}" data-end="${charPos + tok.length}">${escapeHtml(tok)}</span>`;
        }
        charPos += tok.length;
      });
      html += '</div>';
      msgContainer.innerHTML = html;
    }

    function escapeHtml(str) {
      const p = document.createElement('p');
      p.textContent = str;
      return p.innerHTML;
    }

    // Speech Synthesis with word boundary highlighting
    function speakCurrentText() {
      if (!currentText || !window.speechSynthesis) return;

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        resetSpeakButton();
        return;
      }

      window.speechSynthesis.cancel();
      renderWords(currentText);

      const utt = new SpeechSynthesisUtterance(currentText);
      utt.rate = 0.95;

      speakBtn.classList.add('speaking');
      speakIcon.textContent = '⏹';
      speakLabel.textContent = 'Stop Speaking';

      utt.onboundary = (ev) => {
        if (ev.name !== 'word') return;
        const ci = ev.charIndex;
        document.querySelectorAll('.word').forEach(s => {
          const st = parseInt(s.dataset.start);
          const en = parseInt(s.dataset.end);
          if (ci >= st && ci < en) {
            s.classList.add('highlight');
          } else {
            s.classList.remove('highlight');
          }
        });
      };

      utt.onend = resetSpeakButton;
      utt.onerror = resetSpeakButton;

      window.speechSynthesis.speak(utt);
    }

    function resetSpeakButton() {
      speakBtn.classList.remove('speaking');
      speakIcon.textContent = '🔊';
      speakLabel.textContent = 'Speak Display';
      document.querySelectorAll('.word').forEach(s => s.classList.remove('highlight'));
    }

    // Reaction dispatcher
    function sendReaction(emoji) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('REACTION:' + emoji);
        if (navigator.vibrate) navigator.vibrate(30);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const appName = urlParams.get('app') || 'AlphaAAC';
    const appEl = document.getElementById('companion-app-name');
    if (appEl) appEl.textContent = `💬 ${appName}`;
    document.title = `${appName} Companion • Partner Screen`;

    // WebSocket connection
    function connect() {
      clearTimeout(retryTimer);
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const basePath = window.location.pathname.replace(/\/companion(\.html)?$/, '');
      const wsUrl = `${proto}//${window.location.host}${basePath}/ws?role=companion`;

      statusPill.className = 'waiting';
      statusText.textContent = 'Connecting...';

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        console.error('[WS Error]', err);
        statusPill.className = '';
        statusText.textContent = 'Partner Screen Ready';
        retryConnect();
        return;
      }

      ws.onopen = () => {
        statusPill.className = 'connected';
        statusText.textContent = 'Live Connected';
      };

      ws.onmessage = (e) => {
        const data = e.data;
        if (!data) return;

        if (data.startsWith('TEXT:')) {
          currentText = data.substring(5);
        } else if (!data.startsWith('REACTION:') && !data.startsWith('COUNT:')) {
          currentText = data;
        }
        renderWords(currentText);
      };

      ws.onclose = () => {
        statusPill.className = '';
        statusText.textContent = 'Partner Screen Ready';
        retryConnect();
      };

      ws.onerror = () => {
        try { ws.close(); } catch (_) {}
      };
    }

    function retryConnect() {
      clearTimeout(retryTimer);
      retryTimer = setTimeout(connect, 4000);
    }

    connect();
  </script>
</body>
</html>
